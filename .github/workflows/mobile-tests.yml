name: Mobile tests

on:
  push:
    branches: [main]
    paths:
      - "mobile-tests/**"
      - "test-core/**"
      - "pom.xml"
      - ".github/workflows/mobile-tests.yml"
  pull_request:
    paths:
      - "mobile-tests/**"
      - "test-core/**"
      - "pom.xml"
      - ".github/workflows/mobile-tests.yml"
  schedule:
    - cron: "0 4 * * *" # nightly regression
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        type: choice
        options: [dev, staging]
        default: dev
      platform:
        description: Which platform to test
        type: choice
        options: [android, ios, both]
        default: android
      tags:
        description: JUnit tags to run (e.g. smoke). Empty = all
        required: false
      app_url:
        description: Override app build URL (.apk for Android, zipped .app for iOS)
        required: false
  # Lets the mobile repo trigger this after it builds a new app:
  # POST /repos/Uniezz/uniezz-testing/dispatches
  #   {"event_type":"mobile-tests","client_payload":{"env":"staging","platform":"android","app_url":"https://..."}}
  repository_dispatch:
    types: [mobile-tests]

concurrency:
  group: mobile-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_ENV: ${{ inputs.env || github.event.client_payload.env || 'dev' }}
  TEST_TAGS: ${{ inputs.tags || github.event.client_payload.tags || '' }}

jobs:
  android:
    if: ${{ (inputs.platform || github.event.client_payload.platform || 'android') != 'ios' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Repo variable ANDROID_APP_URL = where the mobile team publishes the latest .apk
      APP_URL: ${{ inputs.app_url || github.event.client_payload.app_url || vars.ANDROID_APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download app
        run: curl -fL -o mobile-tests/apps/uniezz.apk "$APP_URL"

      - name: Install and start Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2
          nohup appium --log appium.log > /dev/null 2>&1 &

      - name: Build modules
        run: mvn -B -pl mobile-tests -am install -DskipTests

      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: GROUPS_ARG=""; if [ -n "$TEST_TAGS" ]; then GROUPS_ARG="-Dgroups=$TEST_TAGS"; fi; mvn -B -pl mobile-tests verify -Denv="$TEST_ENV" -Dmobile.platform=android $GROUPS_ARG

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-reports-android
          path: |
            mobile-tests/target/surefire-reports/
            appium.log

  ios:
    if: ${{ (inputs.platform || github.event.client_payload.platform) == 'ios' || (inputs.platform || github.event.client_payload.platform) == 'both' }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # Repo variable IOS_APP_URL = zipped simulator build (.app) from the mobile team
      APP_URL: ${{ inputs.app_url || github.event.client_payload.app_url || vars.IOS_APP_URL }}
      IOS_DEVICE: ${{ vars.IOS_DEVICE || 'iPhone 15' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download app
        run: |
          curl -fL -o app.zip "$APP_URL"
          unzip -q app.zip -d mobile-tests/apps/

      - name: Boot simulator
        run: xcrun simctl boot "$IOS_DEVICE" || true

      - name: Install and start Appium
        run: |
          npm install -g appium
          appium driver install xcuitest
          nohup appium --log appium.log > /dev/null 2>&1 &

      - name: Run tests on iOS simulator
        run: |
          GROUPS_ARG=""
          if [ -n "$TEST_TAGS" ]; then GROUPS_ARG="-Dgroups=$TEST_TAGS"; fi
          mvn -B -pl mobile-tests -am verify -Denv="$TEST_ENV" -Dmobile.platform=ios -Dmobile.ios.device="$IOS_DEVICE" $GROUPS_ARG

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-reports-ios
          path: |
            mobile-tests/target/surefire-reports/
            appium.log
